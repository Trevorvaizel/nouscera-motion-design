name: Observable graph checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  graph-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r harness/runtime/observable/requirements.txt
      - run: python -m unittest discover -s harness/runtime/observable/tests -v
